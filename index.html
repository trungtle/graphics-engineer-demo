<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6fa" />
    <title>Light Lab</title>
  </head>
  <body>
    <main id="app">
      <div class="station" id="st-light" data-station="light">
      <section id="stage" class="stage-card" aria-label="Live path-traced scene">
        <div class="viewport-slot" id="slot-light">
          <div id="viewport">
            <canvas id="view"></canvas>
            <div id="hud" hidden></div>
          </div>
        </div>
        <div id="stage-stats">
          <div class="stat t-int"><span class="stat-num" id="spp">0</span><span class="stat-lab">samples per pixel</span></div>
          <div class="stat t-int"><span class="stat-num" id="rays">0</span><span class="stat-lab">rays traced</span></div>
          <div class="conv"><canvas id="conv" aria-label="Noise as samples add up"></canvas><span class="conv-lab">noise <b id="noise"></b></span></div>
        </div>
        <p id="explain" role="status" aria-live="polite"></p>
      </section>

      <aside id="panel" class="panel-col">
        <header id="brand">
          <h1>Light Lab</h1>
        </header>

        <section id="equation" aria-label="The rendering equation">
          <h2>The rendering equation</h2>
          <div class="eq" role="group" aria-label="L out equals L emitted plus the integral of f r times L in times cosine theta">
            <button class="term t-lo" data-term="lo" type="button" aria-label="L out">L<sub>o</sub></button>
            <span class="op">=</span>
            <button class="term t-le" data-term="le" type="button" aria-label="L emitted">L<sub>e</sub></button>
            <span class="op">+</span>
            <button class="term t-int" data-term="int" type="button" aria-label="Integral">&int;</button>
            <button class="term t-fr" data-term="fr" type="button" aria-label="f r">f<sub>r</sub></button>
            <button class="term t-li" data-term="li" type="button" aria-label="L in">L<sub>i</sub></button>
            <button class="term t-cos" data-term="cos" type="button" aria-label="Cosine theta">cos&thinsp;&theta;</button>
            <button class="term t-int" data-term="int" type="button" aria-label="d omega">d&omega;</button>
          </div>
        </section>

        <section id="controls" aria-label="Controls"></section>
      </aside>
      </div>

      <div class="station compact" id="st-mirrors" data-station="mirrors" hidden>
        <section class="stage-card" aria-label="Light puzzle">
          <div class="viewport-slot" id="slot-mirrors"><canvas id="bench-overlay"></canvas></div>
        </section>
        <aside class="panel-col">
          <header class="brand"><h1>Mirrors</h1></header>
          <section id="mirror-controls" aria-label="Level"></section>
        </aside>
      </div>

      <div class="station compact" id="st-mis" data-station="mis" hidden>
        <section class="stage-card" aria-label="Multiple importance sampling">
          <div class="viewport-slot" id="slot-mis">
            <div class="mis-labels" id="mis-labels"><span>BSDF sampling</span><span>Light sampling</span><span>MIS</span></div>
          </div>
        </section>
        <aside class="panel-col">
          <header class="brand"><h1>MIS</h1></header>
          <section id="mis-controls" aria-label="Sampling"></section>
        </aside>
      </div>

      <div class="station compact" id="st-fluid" data-station="fluid" hidden>
        <section class="stage-card" aria-label="Water tank">
          <div class="fluid-stage"><canvas id="fluid-canvas"></canvas></div>
        </section>
        <aside class="panel-col">
          <header class="brand"><h1>Water</h1></header>
          <section id="fluid-controls" aria-label="Tank"></section>
        </aside>
      </div>

      <nav id="tabs" aria-label="Stations" hidden></nav>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
